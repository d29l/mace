<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Mace's mark: a tilted square with a square hole, faceted like the head of a
       mace into four faces lit from the top left. -->
  <defs>
    <mask id="hole">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <rect x="200" y="200" width="112" height="112" rx="16" fill="black"/>
    </mask>
    <clipPath id="shape"><rect x="76" y="76" width="360" height="360" rx="84"/></clipPath>
  </defs>
  <g transform="rotate(15 256 256)">
    <g clip-path="url(#shape)" mask="url(#hole)">
      <polygon points="76,76 436,76 256,256" fill="#ef5a49"/>
      <polygon points="436,76 436,436 256,256" fill="#c4342a"/>
      <polygon points="436,436 76,436 256,256" fill="#8e2219"/>
      <polygon points="76,436 76,76 256,256" fill="#d8402f"/>
    </g>
  </g>
</svg>
