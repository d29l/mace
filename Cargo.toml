[package]
name = "mace"
version = "0.1.2"
edition = "2024"
description = "A Roblox launcher for Linux, with multiple accounts built in"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
plist = "1.10"
regex = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
libc = "0.2"
tempfile = "3"
anyhow = "1"
mace-proto = { path = "proto" }
png = "0.18"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[workspace]
members = [".", "proto", "layer", "dev/standin"]
# what install.sh builds; the stand-in is only for tests
default-members = [".", "layer"]
